<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수강생 학사일정 보드</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<title>수강생 학사일정 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0E1012; --surface:#15181B; --surface-2:#1A1E21; --surface-3:#232830;
  --ink:#F1F3F5; --ink-2:#B6BDC5; --ink-3:#89919A; --ink-4:#69717A;
  --line:#212629; --line-2:#2D333A; --line-3:#3B434B;
  --accent:#7AA2F7; --accent-soft:#232E45; --accent-on:#0B0F16;
  --danger:#EE7A70; --danger-soft:#33211F;
  --warn:#DDA95C; --ok:#6BC5A4;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 10px 30px -14px rgba(0,0,0,.75);
  --shadow-lg:0 28px 70px -20px rgba(0,0,0,.85);
  --wkcell:#12161A; --zebra:rgba(255,255,255,.014); --hdr:#181C20;
  --r:8px; --r-sm:6px;
  --c-film-bg:#242F44;   --c-film-tx:#9DBAF7;   --c-film-br:#5A7FD4;
  --c-three-bg:#3B3123;  --c-three-tx:#E6B978;  --c-three-br:#C08A3E;
  --c-motion-bg:#302B44; --c-motion-tx:#C3AAF4; --c-motion-br:#8E6FD8;
  --c-graphic-bg:#3E2A32;--c-graphic-tx:#F2A4B7;--c-graphic-br:#D06A85;
  --c-ux-bg:#21363B;     --c-ux-tx:#88D5E1;     --c-ux-br:#4A9FAF;
  --c-ai-bg:#2F3824;     --c-ai-tx:#C0D67E;     --c-ai-br:#8CA843;
  --c-etc-bg:#2B2F34;    --c-etc-tx:#B0B9C1;    --c-etc-br:#78828B;
}
:root[data-mode="light"]{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FCFCFD; --surface-3:#F0F2F5;
  --ink:#14171A; --ink-2:#4A525B; --ink-3:#79828C; --ink-4:#9AA2AB;
  --line:#EBEEF1; --line-2:#DCE0E5; --line-3:#C6CCD3;
  --accent:#3B62D9; --accent-soft:#E4EAFB; --accent-on:#FFFFFF;
  --danger:#C0392E; --danger-soft:#FAE9E7;
  --warn:#8A6111; --ok:#177A59;
  --shadow-sm:0 1px 2px rgba(18,22,28,.06);
  --shadow:0 8px 24px -12px rgba(18,22,28,.20);
  --shadow-lg:0 24px 60px -18px rgba(18,22,28,.26);
  --wkcell:#F4F6F8; --zebra:rgba(18,24,32,.014); --hdr:#FBFCFD;
  --c-film-bg:#E4E8F7;   --c-film-tx:#2C4795;   --c-film-br:#3D5CC4;
  --c-three-bg:#F5ECE0;  --c-three-tx:#835415;  --c-three-br:#B5761F;
  --c-motion-bg:#ECE6F7; --c-motion-tx:#553396; --c-motion-br:#7A4FC9;
  --c-graphic-bg:#F7E5E9;--c-graphic-tx:#96304A;--c-graphic-br:#C4485F;
  --c-ux-bg:#DFEEF0;     --c-ux-tx:#125F6C;     --c-ux-br:#1A8496;
  --c-ai-bg:#EAF0E0;     --c-ai-tx:#465F16;     --c-ai-br:#6B9020;
  --c-etc-bg:#EAECED;    --c-etc-tx:#48525A;    --c-etc-br:#6B757D;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Instrument Sans","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:14px;line-height:1.6;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------------- shell ---------------- */
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  display:flex;align-items:center;gap:12px;height:60px;padding:0 22px;flex:none;
  background:var(--surface-2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.logo{font-size:15px;font-weight:600;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--accent)}
.subcount{
  font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums;
  padding-left:12px;border-left:1px solid var(--line-2);letter-spacing:0;
}
.grow{margin-left:auto}
.savestate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);margin-right:4px}
.fbchip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface-3);color:var(--ink-3);font-size:11.5px;
  white-space:nowrap;transition:background .14s,color .14s;
}
.fbchip:hover{background:var(--line-2);color:var(--ink)}
.fbchip.live{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.fbchip .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
.dot.dirty{background:var(--warn)}
.dot.saved{background:var(--ok)}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-3);color:var(--ink-2);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.btn:hover{background:var(--line-2);color:var(--ink);border-color:var(--line-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent);border-color:var(--accent)}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.gh:hover{background:var(--surface-3);color:var(--ink);border-color:transparent}
.btn.gh.on{color:var(--ink);background:var(--surface-3);border-color:var(--line-2)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:var(--r-sm)}
.btn.dg{color:var(--danger);background:transparent;border-color:var(--line-2)}
.btn.dg:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.themebtn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface-3);color:var(--ink-3);font-size:14px;
  transition:background .14s,color .14s;
}
.themebtn:hover{background:var(--line-2);color:var(--ink)}

/* ---------------- student name ---------------- */
.namefield{display:flex;flex-direction:column;gap:3px;min-width:0}
.namefield > label{
  font-size:10px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
}
input.nameinput{
  border:none;border-bottom:1px solid var(--line-2);background:transparent;color:var(--ink);
  font-size:23px;font-weight:600;letter-spacing:-.03em;padding:0 2px 7px;width:230px;
  transition:border-color .14s ease;
}
input.nameinput::placeholder{color:var(--ink-4);font-weight:400;letter-spacing:-.01em}
input.nameinput:hover{border-bottom-color:var(--line-3)}
input.nameinput:focus{outline:none;border-bottom-color:var(--accent)}

/* ---------------- work area ---------------- */
.work{display:flex;align-items:flex-start;flex:1;min-height:0}
.panel{flex:1;min-width:0;padding:26px 22px 72px}
.stuline{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.ctl{display:flex;align-items:center;gap:8px;padding-bottom:2px}
.ctl > label{
  font-size:10px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
}
.stepper{
  display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);
  overflow:hidden;background:var(--surface);height:34px;
}
.stepper button{width:28px;height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:14px}
.stepper button:hover{background:var(--surface-3);color:var(--ink)}
.stepper .val{
  padding:0 12px;font-size:13.5px;min-width:66px;text-align:center;color:var(--ink);
  font-variant-numeric:tabular-nums;font-weight:500;
}
select.inp{
  height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:13.5px;
}
.endhint{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toggles{display:flex;gap:6px;margin-left:auto;padding-bottom:2px}

/* ---------------- grid ---------------- */
.gridwrap{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow-x:auto;overflow-y:visible;padding:0 0 4px;
  box-shadow:var(--shadow-sm);
  scrollbar-width:thin;scrollbar-color:var(--line-3) transparent;
}
.grid{display:grid;width:max-content;min-width:100%;--slotw:120px;--colw:89px}
.gh{text-align:center;color:var(--ink-2)}
.gh.yr{
  font-size:11px;font-weight:600;letter-spacing:.24em;color:var(--ink-4);
  padding:14px 0 6px;background:var(--hdr);font-variant-numeric:tabular-nums;
}
.gh.mo{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;
  padding:2px 0 13px;background:var(--hdr);
}
.mo-n{
  font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.mo-u{font-size:10.5px;color:var(--ink-4);letter-spacing:.08em;line-height:1}
.gh.mo.jan .mo-n{color:var(--ink)}
.gh.mo.now{background:var(--accent-soft)}
.gh.mo.now .mo-n{color:var(--accent)}
.gh.mo.now .mo-u{color:var(--accent);opacity:.8}
.gh.mo.q{box-shadow:inset 1px 0 0 var(--line-2)}
.corner{background:var(--hdr);border-right:1px solid var(--line-2)}
.headrule{grid-row:var(--gr);grid-column:1/-1;height:1px;background:var(--line-2)}

.slotlbl{
  position:sticky;left:0;z-index:5;background:var(--surface);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;
  padding:0 14px;white-space:nowrap;overflow:hidden;
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line);
}
.slot-t{
  font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.slot-tag{font-size:9.5px;letter-spacing:.18em;color:var(--ink-4);font-weight:600}
.slotlbl.wk{background:var(--wkcell)}
.slotlbl.wk .slot-t{color:var(--ink-2);font-weight:400}
.slotlbl.wkfirst,.cell.wkfirst{border-top:1px solid var(--line-3)}

.cell{
  border-bottom:1px solid var(--line);box-shadow:inset 1px 0 0 var(--line);
  min-height:62px;min-width:0;
}
.cell.alt{background:var(--zebra)}
.cell.q{box-shadow:inset 1px 0 0 var(--line-2)}
.cell.wk{background:var(--wkcell)}
.cell.now{background:var(--zebra)}
.cell.editable{cursor:text}
.cell.editable:hover{background:var(--surface-3)}
.celledit{
  grid-row:var(--gr);grid-column:var(--gc);margin:8px 6px;z-index:6;
  display:flex;align-items:center;background:var(--surface-3);
  border:1px solid var(--accent);border-radius:7px;overflow:hidden;
}
.celledit input{
  width:100%;height:100%;border:none;background:transparent;color:var(--ink);
  font-size:12.5px;font-weight:600;text-align:center;padding:4px 6px;letter-spacing:-.015em;
}
.celledit input:focus{outline:none}
.celledit input::placeholder{color:var(--ink-4);font-weight:400}

.block{
  grid-row:var(--gr);grid-column:var(--gc);min-width:0;
  margin:8px 6px;border-radius:7px;display:flex;overflow:hidden;position:relative;z-index:3;
  cursor:grab;background:var(--cb);color:var(--ct);
  box-shadow:inset 2px 0 0 var(--cr);
  transition:box-shadow .14s ease,transform .14s ease;
}
.block:hover{box-shadow:inset 2px 0 0 var(--cr), 0 4px 14px -4px rgba(0,0,0,.4)}
.block.dragging{opacity:.28;pointer-events:none}
.block .segs{display:flex;flex:1;min-width:0}
.seg{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  padding:6px 9px;font-size:12.5px;font-weight:600;text-align:center;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.seg + .seg{box-shadow:inset 1px 0 0 var(--cr)}
.block .grip{
  position:absolute;right:0;top:0;bottom:0;width:11px;cursor:ew-resize;
  display:flex;align-items:center;justify-content:center;
}
.block .grip::after{
  content:"";width:2px;height:18px;border-radius:2px;background:var(--cr);
  opacity:0;transition:opacity .14s;
}
.block:hover .grip::after{opacity:.9}
.block.note::before{
  content:"";position:absolute;top:5px;right:13px;width:4px;height:4px;border-radius:50%;
  background:var(--cr);
}
.preview{
  grid-row:var(--gr);grid-column:var(--gc);margin:8px 6px;border-radius:7px;z-index:4;
  border:1px dashed var(--accent);background:var(--accent-soft);pointer-events:none;
}
.preview.bad{border-color:var(--danger);background:var(--danger-soft)}
.dghost{
  position:fixed;z-index:200;pointer-events:none;border-radius:7px;
  padding:7px 13px;font-size:12.5px;font-weight:600;
  background:var(--cb);color:var(--ct);
  box-shadow:inset 2px 0 0 var(--cr), var(--shadow-lg);
  transform:translate(-50%,-50%);white-space:nowrap;
}
.dghost.del{background:var(--danger);color:#fff;box-shadow:var(--shadow-lg)}

/* ---------------- palette ---------------- */
.rail{
  width:196px;flex:none;align-self:stretch;background:var(--surface);
  border-left:1px solid var(--line);padding:26px 16px 72px;
  position:sticky;top:60px;max-height:calc(100vh - 60px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;
}
.rt{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--ink-4);margin:0 0 10px;
  text-transform:uppercase}
.hint{font-size:11.5px;color:var(--ink-3);margin:0 0 20px;line-height:1.65;letter-spacing:0}
.cat{font-size:10.5px;color:var(--ink-4);letter-spacing:.12em;margin:18px 0 8px;font-weight:600}
.cat:first-of-type{margin-top:0}
.cs{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;
  font-size:12px;font-weight:600;cursor:grab;user-select:none;touch-action:none;
  background:var(--cb);color:var(--ct);box-shadow:inset 2px 0 0 var(--cr);
  transition:transform .12s ease,box-shadow .12s ease;letter-spacing:-.015em;
}
.chip:hover{transform:translateY(-1px);box-shadow:inset 2px 0 0 var(--cr), 0 4px 12px -4px rgba(0,0,0,.35)}
.chip .ed{opacity:0;font-size:11px}
.chip:hover .ed{opacity:.6}
.trash{
  margin-top:22px;border:1px dashed var(--line-2);border-radius:9px;padding:18px 10px;
  text-align:center;font-size:11.5px;color:var(--ink-4);transition:all .14s;
}
.trash.hot{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}

/* ---------------- roster ---------------- */
.roster{padding:30px 24px 80px;max-width:1440px;width:100%}
.rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.rhead h2{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:0}
.rhead .sub{font-size:12.5px;color:var(--ink-4)}
.filters{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
input.inp{
  height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-size:13px;
}
input.inp::placeholder{color:var(--ink-4)}
.tablewrap{
  border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--surface);
  box-shadow:var(--shadow-sm);scrollbar-width:thin;scrollbar-color:var(--line-3) transparent;
}
table.roster-t{border-collapse:collapse;width:100%;min-width:1000px}
table.roster-t th{
  text-align:left;font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--ink-4);
  padding:14px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;
  text-transform:uppercase;background:var(--hdr);
}
table.roster-t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.roster-t tr:last-child td{border-bottom:none}
table.roster-t tbody tr:hover td{background:var(--zebra)}
.cellin{
  width:100%;background:transparent;border:1px solid transparent;border-radius:6px;
  padding:6px 8px;font-size:13.5px;color:var(--ink);transition:border-color .12s,background .12s;
}
.cellin:hover{border-color:var(--line-2)}
.cellin:focus{border-color:var(--accent);background:var(--bg);outline:none}
.cellin.nm{font-weight:600;letter-spacing:-.02em}
.cellin.mono{font-variant-numeric:tabular-nums}
input.cellin[type="date"]{font-variant-numeric:tabular-nums;font-size:13px}
input.cellin[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.5);cursor:pointer}
input.cellin.empty::-webkit-datetime-edit{color:var(--ink-4);opacity:.6}
select.cellin{cursor:pointer}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.mrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.mrow .cellin{border-color:var(--line-2);flex:1}
.roster-t td .badge + .term{margin-left:10px}
.ibtn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-4);font-size:13px;transition:background .12s,color .12s;
}
.ibtn:hover{background:var(--surface-3);color:var(--ink)}
.ibtn.dg:hover{background:var(--danger-soft);color:var(--danger)}
.term{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:0 8px;
  font-variant-numeric:tabular-nums}
.badge{
  display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface-3);color:var(--ink-3);letter-spacing:.02em;
}
.badge.on{background:var(--accent-soft);color:var(--accent)}
.emptyrow{padding:34px 14px;text-align:center;color:var(--ink-4);font-size:13px}

/* ---------------- reference ---------------- */
.ref{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-top:20px}
.ref summary{
  padding:14px 18px;cursor:pointer;font-size:13px;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;gap:9px;
}
.ref summary::-webkit-details-marker{display:none}
.ref summary::before{content:"›";color:var(--ink-4);font-size:15px;transition:transform .16s}
.ref[open] summary::before{transform:rotate(90deg)}
.refbody{padding:2px 18px 22px;display:flex;gap:44px;flex-wrap:wrap}
table.tt{border-collapse:collapse;font-size:12.5px}
table.tt th{
  text-align:left;font-weight:600;color:var(--ink-4);font-size:10px;letter-spacing:.16em;
  padding:4px 18px 8px 0;border-bottom:1px solid var(--line-2);text-transform:uppercase;
}
table.tt td{padding:5px 18px 5px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
table.tt td.d{font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ---------------- overlays ---------------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,12,.62);z-index:100;backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{
  background:var(--surface-2);border-radius:14px;box-shadow:var(--shadow-lg);
  width:min(460px,100%);max-height:88vh;overflow-y:auto;border:1px solid var(--line-2);
}
.modal header{padding:22px 24px 8px;font-size:16px;font-weight:600;letter-spacing:-.025em}
.modal .mbody{padding:10px 24px 4px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:18px 24px 22px;display:flex;gap:8px;justify-content:flex-end}
.frow{display:flex;flex-direction:column;gap:6px}
.frow > label{font-size:10px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.frow input,.frow select,.frow textarea{
  padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r);

}

.frow textarea{resize:vertical;min-height:60px}

.note-p{font-size:12px;color:var(--ink-4);margin:0;line-height:1.65}

.pop{
  position:fixed;z-index:120;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:15px;width:268px;
  display:flex;flex-direction:column;gap:11px;
}
.pt{font-size:10px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.pop select,.pop input{
  padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);width:100%;font-size:13px;
}
.pop select:focus,.pop input:focus{outline:none;border-color:var(--accent)}
.prow{display:flex;gap:8px;align-items:center}

  white-space:nowrap;cursor:pointer}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:300;
  background:var(--surface-3);color:var(--ink);padding:11px 22px;border-radius:999px;
  font-size:13px;box-shadow:var(--shadow-lg);border:1px solid var(--line-2);
}
.toast.err{background:var(--danger);color:#fff;border-color:transparent;font-weight:600}

.menu{
  position:fixed;z-index:120;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;min-width:216px;
}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;
  font-size:13px;color:var(--ink-2);transition:background .12s,color .12s}
.menu button:hover{background:var(--surface-3);color:var(--ink)}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 3px}

.shell.norail .rail{display:none}
@media (max-width:900px){
  .work{flex-direction:column}
  .rail{width:100%;position:static;max-height:none;border-left:none;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

","대체 휴일 (광복절)"],["2026-09-24","추석 연휴"],["2026-09-25","추석 연휴"],["2026-09-26","추석 연휴"],["2026-10-05","대체 휴일 (개천절)"],["2026-10-09","한글날"],["2026-12-25","성탄절"],["2027-01-01","신정"]],"terms":[[1,"2026-01-07","2026-01-28"],[2,"2026-02-02","2026-02-27"],[3,"2026-03-16","2026-04-10"],[4,"2026-04-13","2026-05-12"],[5,"2026-05-13","2026-06-10"],[6,"2026-06-11","2026-07-08"],[7,"2026-07-14","2026-08-10"],[8,"2026-08-12","2026-09-09"],[9,"2026-09-14","2026-10-15"],[10,"2026-10-19","2026-11-13"],[11,"2026-11-17","2026-12-14"],[12,"2026-12-15","2027-01-13"]],"defaultStart":[2026,8]}</script>
<script>
(function(){
"use strict";

var BOOT = JSON.parse(document.getElementById('app-data').textContent);
var D = BOOT;
var UI = { view:'schedule', studentId:null, q:'', mentorFilter:'', dirty:false, saving:false,
           savedOnce:false, railOpen:true, mode:'dark', standalone:false };
var LSKEY = 'sched:' + location.pathname;
var artifactApi = null, downloadsApi = null;

/* ============ Firebase 실시간 연동 ============ */
var FB_CONFIG = {
  apiKey: "AIzaSyCb6Evq51skrbDw_cbz9_S9LsjcY1fy9hA",
  authDomain: "student-f3e8a.firebaseapp.com",
  projectId: "student-f3e8a",
  storageBucket: "student-f3e8a.firebasestorage.app",
  messagingSenderId: "777480206536",
  appId: "1:777480206536:web:1eedd24ed40f0e12f48dfd"
};
var FB = { available:false, db:null, auth:null, user:null, unsub:null, ready:false, err:'' };

try{
  var draft = localStorage.getItem(LSKEY);
  if(draft){
    var p = JSON.parse(draft);
    if(p && p.data && p.baseVersion === (D.version||1)){ D = p.data; UI.dirty = true; }
  }
}catch(e){}
try{ UI.studentId = localStorage.getItem(LSKEY+':sel') || null;
     UI.railOpen = localStorage.getItem(LSKEY+':rail')!=='0';
     UI.mode = localStorage.getItem(LSKEY+':mode')==='light' ? 'light' : 'dark'; }catch(e){}
function defStart(){
  var ds = D.defaultStart || [2026,8];
  return {y: ds[0], m: ds[1]};
}
function blankStudent(){
  var ds = defStart();
  return {id:'s'+Date.now()+Math.floor(Math.random()*90+10),
    mentorId: D.mentors[0].id, name:'', status:'수강중', extId:'', phone:'', course:'',
    enrolledAt:'', note:'', startYear:ds.y, startMonth:ds.m, monthCount:12, blocks:[]};
}
if(!D.students.length) D.students.push(blankStudent());
if(!UI.studentId || !D.students.some(function(s){return s.id===UI.studentId;}))
  UI.studentId = D.students[0].id;

var MON = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var STATUS = ['수강중','휴강','수료','상담중','중도이탈'];
var RESTING = {'수료':1,'중도이탈':1};

function uid(p){ return p + Math.random().toString(36).slice(2,7) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function cur(){ return byId(D.students, UI.studentId); }
function subj(id){ return byId(D.subjects,id) || {id:id,name:'(삭제된 과목)',cat:'etc'}; }
function catOf(id){ return byId(D.categories,id) || {id:'etc',name:'기타'}; }
function months(st){
  var out=[], y=st.startYear, m=st.startMonth;
  for(var i=0;i<st.monthCount;i++){ out.push({y:y,m:m,label:MON[m-1]}); m++; if(m>12){m=1;y++;} }
  return out;
}
function endOf(st){ var ms=months(st); return ms[ms.length-1]; }
function mark(){ UI.dirty=true; persistLocal(); paintSaveState(); schedulePush(); }
function persistLocal(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({baseVersion:D.version||1,data:D})); }catch(e){}
}
function clearLocal(){ try{ localStorage.removeItem(LSKEY); }catch(e){} }

var toastT=null;
function toast(msg, isErr){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'+(isErr?' err':''); t.textContent=msg;
  document.body.appendChild(t); clearTimeout(toastT);
  toastT=setTimeout(function(){ t.remove(); }, 2800);
}

/* ================= render ================= */
var app = document.getElementById('app');

function applyMode(){
  document.documentElement.setAttribute('data-mode', UI.mode);
}
function render(){
  applyMode();
  app.className = 'shell' + (UI.railOpen ? '' : ' norail');
  app.innerHTML = UI.view==='roster'
    ? topbar() + '<div class="roster">' + rosterPane() + '</div>'
    : topbar() + '<div class="work">' + schedulePane() + rail() + '</div>';
  wire();
}

function topbar(){
  return '<div class="topbar">' +
    '<span class="logo">학사<em>일정</em></span>' +
    '<span class="subcount">수강생 ' + D.students.length + ' · 멘토 ' + D.mentors.length + '</span>' +
    '<span class="grow"></span>' +
    '<div class="savestate" id="savestate"></div>' +
    fbChip() +
    (UI.view==='roster'
      ? '<button class="btn gh" data-act="view-schedule">← 일정으로</button>'
      : '<button class="btn gh" data-act="view-roster">일정 목록</button>') +
    '<button class="btn" data-act="export">내보내기</button>' +
    '<button class="themebtn" data-act="mode" title="'+(UI.mode==='dark'?'밝은 화면으로':'어두운 화면으로')+'">' +
      (UI.mode==='dark'?'☾':'☀') + '</button>' +
    '<button class="btn pri" data-act="publish" id="pubbtn">' +
      (UI.standalone ? '백업 내려받기' : '저장') + '</button>' +
  '</div>';
}

function studentSelect(st){
  return '<div class="namefield"><label>수강생</label>' +
    '<input class="nameinput" id="stuname" data-act="setname" placeholder="이름을 적으세요" ' +
    'value="'+esc(st.name)+'" autocomplete="off" spellcheck="false"></div>';
}

function fbChip(){
  if(!FB.available) return '';
  if(FB.user) return '<button class="fbchip live" data-act="fb" title="' + esc(FB.user.email||'') + '">' +
    '<span class="pulse"></span>관리파일 연동 중</button>';
  return '<button class="fbchip" data-act="fb">연동 안 됨</button>';
}

function schedulePane(){
  var st = cur();
  if(!st) return '<div class="panel"><p class="hint">수강생이 없습니다. 위 ＋ 를 눌러 추가하세요.</p></div>';
  var ms = months(st), last = ms[ms.length-1];
  return '<div class="panel">' +
    '<div class="stuline">' +
      studentSelect(st) +
      '<div class="ctl"><label>시작</label>' +
        '<div class="stepper"><button data-act="y-">‹</button>' +
        '<span class="val">'+st.startYear+'</span><button data-act="y+">›</button></div>' +
        '<select class="inp" data-act="setmonth">' +
          MON.map(function(m,i){ return '<option value="'+(i+1)+'"'+(st.startMonth===i+1?' selected':'')+'>'+m+'</option>'; }).join('') +
        '</select></div>' +
      '<div class="ctl"><label>기간</label>' +
        '<div class="stepper"><button data-act="len-">−</button>' +
        '<span class="val">'+st.monthCount+'개월</span><button data-act="len+">＋</button></div>' +
        '<span class="endhint">→ '+last.y+'.'+String(last.m).padStart(2,'0')+'</span></div>' +
      '<div class="toggles">' +
        (orphanCount(st) ? '<button class="btn sm gh" data-act="orphans" ' +
          'title="관리파일에는 있지만 표에 못 올린 배정">보류 ' + orphanCount(st) + '건</button>' : '') +
        '<button class="btn sm gh" data-act="quick-add">＋ 새 수강생</button>' +
        '<button class="btn sm gh'+(UI.railOpen?' on':'')+'" data-act="rail">과목 패널</button>' +
      '</div>' +
    '</div>' +
    '<div class="gridwrap" id="gridwrap">' + gridHtml(st, ms) + '</div>' +
    refHtml() +
  '</div>';
}

var ROWMAP = {};
function visibleSlots(st){
  var weekday=[], weekend=[];
  D.slots.forEach(function(sl,i){
    if(sl.indexOf('주말')===0) weekend.push(i); else weekday.push(i);
  });
  return weekday.concat(weekend);
}
function gridHtml(st, ms){
  var n = ms.length;
  var vis = visibleSlots(st), S = vis.length;
  ROWMAP = {};
  vis.forEach(function(si,r){ ROWMAP[si] = r + 4; });
  var h = '<div class="grid" id="grid" style="grid-template-columns:var(--slotw) repeat('+n+',var(--colw));' +
          'grid-template-rows:auto auto 1px repeat('+S+',minmax(62px,auto))">';
  h += '<div class="corner" style="grid-row:1/4;grid-column:1"></div>';
  var i=0;
  while(i<n){
    var y=ms[i].y, j=i; while(j<n && ms[j].y===y) j++;
    h += '<div class="gh yr" style="grid-row:1;grid-column:'+(i+2)+'/'+(j+2)+'">'+y+'</div>';
    i=j;
  }
  var td = new Date(), ty = td.getFullYear(), tm = td.getMonth()+1;
  ms.forEach(function(mm,k){
    var q = (mm.m===1 || mm.m===4 || mm.m===7 || mm.m===10) ? ' q' : '';
    var now = (mm.y===ty && mm.m===tm) ? ' now' : '';
    h += '<div class="gh mo'+(mm.m===1?' jan':'')+q+now+'" style="grid-row:2;grid-column:'+(k+2)+'" ' +
      'title="'+mm.y+'년 '+mm.m+'월'+(now?' · 이번 달':'')+'">' +
      '<span class="mo-n">'+String(mm.m).padStart(2,'0')+'</span>' +
      '<span class="mo-u">월</span></div>';
  });
  h += '<div class="headrule" style="--gr:3"></div>';
  var firstWk = false;
  vis.forEach(function(si){
    var sl = D.slots[si], wk = sl.indexOf('주말')===0, row = ROWMAP[si];
    var time = wk ? sl.replace('주말','').trim() : sl;
    var label = '<span class="slot-t">'+esc(time)+'</span>' +
                (wk ? '<span class="slot-tag">주말</span>' : '');
    var first = wk && !firstWk; if(first) firstWk = true;
    h += '<div class="slotlbl'+(wk?' wk':'')+(first?' wkfirst':'')+'" style="grid-row:'+row+';grid-column:1">'+label+'</div>';
    for(var k=0;k<n;k++){
      var mm = ms[k];
      var cls = 'cell' + (wk?' wk':'') + (first?' wkfirst':'') + (k%2?' alt':'') +
        ((mm.m===1||mm.m===4||mm.m===7||mm.m===10)?' q':'') +
        ((mm.y===ty && mm.m===tm)?' now':'');
      h += '<div class="'+cls+' editable" data-slot="'+si+'" data-m="'+k+'" ' +
           'title="눌러서 과목명 직접 입력" ' +
           'style="grid-row:'+row+';grid-column:'+(k+2)+'"></div>';
    }
  });
  st.blocks.forEach(function(b){
    if(b.start >= n || !ROWMAP[b.slot]) return;
    h += blockHtml(b, Math.min(b.span, n - b.start));
  });
  h += '</div>';
  h += '<datalist id="subjlist">' +
    D.subjects.map(function(x){ return '<option value="'+esc(x.name)+'"></option>'; }).join('') +
    '</datalist>';
  return h;
}

function blockHtml(b, span){
  var s = subj(b.subject), c = catOf(s.cat).id, segs='';
  for(var k=0;k<span;k++) segs += '<div class="seg">'+esc(segLabel(b,k))+'</div>';
  return '<div class="block'+(b.note?' note':'')+'" data-block="'+b.id+'" tabindex="0" ' +
    'style="--gr:'+(ROWMAP[b.slot]||4)+';--gc:'+(b.start+2)+'/span '+span+';'+catVars(c)+'" ' +
    'title="'+esc(s.name + (b.note? ' — '+b.note : ''))+'">' +
    '<div class="segs">'+segs+'</div><div class="grip" data-grip="1"></div></div>';
}
function catVars(c){
  return '--cb:var(--c-'+c+'-bg);--ct:var(--c-'+c+'-tx);--cr:var(--c-'+c+'-br)';
}
function segLabel(b,k){
  var name = subj(b.subject).name;
  return (b.numbered && b.startNo!=null) ? name + (b.startNo + k) : name;
}

function rail(){
  var h = '<aside class="rail"><p class="rt">과목</p>' +
    '<p class="hint">칩을 표로 끌어다 놓으면 배치됩니다. 블록은 끌어서 옮기고, ' +
    '오른쪽 끝을 잡아 늘리면 회차 번호가 이어 붙습니다.</p>';
  D.categories.forEach(function(ct){
    var list = D.subjects.filter(function(s){ return s.cat===ct.id; });
    if(!list.length) return;
    h += '<p class="cat">'+esc(ct.name)+'</p><div class="cs">';
    list.forEach(function(s){
      h += '<span class="chip" data-subject="'+s.id+'" style="'+catVars(ct.id)+'">' +
        esc(s.name) + '<button class="ed" data-act="edit-subject" data-id="'+s.id+'">✎</button></span>';
    });
    h += '</div>';
  });
  h += '<div style="margin-top:18px"><button class="btn sm" data-act="add-subject" ' +
    'style="width:100%;justify-content:center">＋ 과목 추가</button></div>' +
    '<div class="trash" id="trash">여기로 끌면 삭제</div></aside>';
  return h;
}

function refHtml(){
  var t = '<table class="tt"><thead><tr><th>기수</th><th>개강</th><th>종강</th></tr></thead><tbody>' +
    D.terms.map(function(r){ return '<tr><td>'+r[0]+'월</td><td class="d">'+r[1]+'</td><td class="d">'+r[2]+'</td></tr>'; }).join('') +
    '</tbody></table>';
  var hol = '<table class="tt"><thead><tr><th>날짜</th><th>휴일</th></tr></thead><tbody>' +
    D.holidays.map(function(r){ return '<tr><td class="d">'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>'; }).join('') +
    '</tbody></table>';
  return '<details class="ref"><summary>개강·종강일과 휴일</summary>' +
    '<div class="refbody"><div>'+t+'</div><div>'+hol+'</div></div></details>';
}

/* ================= roster ================= */
function rosterPane(){
  var q = UI.q.trim().toLowerCase();
  var h = '<div class="rhead"><h2>일정 목록</h2>' +
    '<span class="sub">저장된 수강생입니다. 칸을 눌러 바로 고칠 수 있습니다.</span>' +
    '<div class="filters">' +
      '<input class="inp" id="q" placeholder="이름 · 연락처 · 원서번호 검색" value="'+esc(UI.q)+'" style="width:220px">' +
      '<select class="inp" data-act="mfilter"><option value="">멘토 전체</option>' +
        D.mentors.map(function(m){ return '<option value="'+m.id+'"'+(UI.mentorFilter===m.id?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('') +
      '</select>' +
      '<button class="btn sm" data-act="manage-mentors">멘토 관리</button>' +
      '<button class="btn sm pri" data-act="quick-add">＋ 수강생</button>' +
    '</div></div>';

  var list = D.students.slice();

  if(q) list = list.filter(function(s){
    return (s.name+' '+(s.phone||'')+' '+(s.extId||'')+' '+(s.course||'')).toLowerCase().indexOf(q)>=0; });
  var order = {};
  D.mentors.forEach(function(m,i){ order[m.id]=i; });
  list.sort(function(a,b){
    var d=(order[a.mentorId]||0)-(order[b.mentorId]||0);
    return d!==0 ? d : a.name.localeCompare(b.name,'ko');
  });

  h += '<div class="tablewrap"><table class="roster-t"><thead><tr>' +
    '<th style="width:150px">멘토</th>' +
    '<th style="width:170px">학생명</th>' +
    '<th style="width:170px">연락처</th>' +
    '<th style="width:170px">원서번호</th>' +
    '<th style="width:210px">수강 기간</th>' +
    '<th></th>' +
    '<th style="width:88px"></th></tr></thead><tbody>';
  if(!list.length){
    h += '<tr><td colspan="7" class="emptyrow">' +
      (q||UI.mentorFilter ? '조건에 맞는 수강생이 없습니다.' : '아직 저장된 수강생이 없습니다. ＋ 수강생으로 추가하세요.') +

       '▤ 를 누르면 그 수강생의 시간표가 열립니다.</p>';
  return h;
}

function onClick(e){
  var cell = e.target.closest && e.target.closest('.cell.editable');
  if(cell && UI.view==='schedule' && !e.target.closest('.block')){ openCellEdit(cell); return; }
  var t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.dataset.act, id = t.dataset.id, st = cur();
  switch(act){
    case 'mode': UI.mode = UI.mode==='dark' ? 'light' : 'dark';
      try{localStorage.setItem(LSKEY+':mode',UI.mode);}catch(err){} render(); break;
    case 'view-roster': UI.view='roster'; render(); break;
    case 'view-schedule': UI.view='schedule'; render(); break;
    case 'open-schedule': UI.studentId=id; UI.view='schedule';
      try{localStorage.setItem(LSKEY+':sel',id);}catch(err){} render(); break;
    case 'quick-add': {
      if(st && !st.name.trim() && !st.blocks.length && UI.view==='schedule'){
        var f0=document.getElementById('stuname'); if(f0) f0.focus();
        return toast('지금 화면이 비어 있습니다. 여기에 바로 적으세요.');
      }
      var nb = blankStudent();
      D.students.push(nb); UI.studentId = nb.id; UI.view='schedule';
      try{localStorage.setItem(LSKEY+':sel',nb.id);}catch(err){}
      mark(); render();
      var f=document.getElementById('stuname'); if(f) f.focus();
      break;
    }
    case 'add-student': openStudent(null); break;
    case 'detail': openStudent(byId(D.students,id)); break;
    case 'manage-mentors': openMentors(); break;
    case 'del-student': {
      var target = id ? byId(D.students,id) : st;
      if(!target) return;
      var warn = (FB.user && FB.db)
        ? target.name+' 수강생을 삭제할까요? 관리파일의 휴지통으로 옮겨집니다.'
        : target.name+' 수강생을 삭제할까요? 시간표도 함께 지워집니다.';
      if(!confirm(warn)) return;
      if(FB.user && FB.db) fbDeleteStudent(target.id);
      D.students = D.students.filter(function(s){ return s.id!==target.id; });
      if(UI.studentId===target.id) UI.studentId = D.students.length? D.students[0].id : null;
      mark(); render(); break;
    }
    case 'add-mentor': {
      var nm = prompt('멘토 이름'); if(!nm || !nm.trim()) return;
      D.mentors.push({id:uid('m'), name:nm.trim()}); mark(); render(); break;
    }
    case 'edit-mentor': {
      var m = byId(D.mentors,id); var nn = prompt('멘토 이름', m.name); if(!nn || !nn.trim()) return;
      m.name = nn.trim(); mark(); render(); break;
    }
    case 'del-mentor': {
      if(D.mentors.length<=1) return toast('멘토는 최소 1명 있어야 합니다.', true);
      var owned = D.students.filter(function(s){ return s.mentorId===id; });
      if(owned.length && !confirm('담당 수강생 '+owned.length+'명이 다른 멘토로 옮겨집니다. 삭제할까요?')) return;
      var other = D.mentors.filter(function(x){ return x.id!==id; })[0];
      owned.forEach(function(s){ s.mentorId = other.id; });
      D.mentors = D.mentors.filter(function(x){ return x.id!==id; });
      if(UI.mentorFilter===id) UI.mentorFilter='';
      mark(); render(); break;
    }
    case 'y-': st.startYear--; mark(); render(); break;
    case 'y+': st.startYear++; mark(); render(); break;
    case 'len-': {
      if(st.monthCount<=3) return;
      var over = st.blocks.filter(function(b){ return b.start + b.span > st.monthCount-1; });
      if(over.length && !confirm('마지막 달의 수업 '+over.length+'건이 잘립니다. 계속할까요?')) return;
      st.monthCount--;
      st.blocks = st.blocks.filter(function(b){ return b.start < st.monthCount; });
      st.blocks.forEach(function(b){ b.span = Math.min(b.span, st.monthCount-b.start); });
      mark(); render(); break;
    }
    case 'len+': if(st.monthCount>=36) return; st.monthCount++; mark(); render(); break;
    case 'rail': UI.railOpen=!UI.railOpen;
      try{localStorage.setItem(LSKEY+':rail',UI.railOpen?'1':'0');}catch(err){} render(); break;
    case 'orphans': openOrphans(); break;
    case 'add-subject': openSubject(null); break;
    case 'edit-subject': e.stopPropagation(); openSubject(byId(D.subjects,id)); break;
    case 'fb': {
      var r = openFbLogin();
      if(r){
        var pa = r.querySelector('#fb-pushall');
        if(pa) pa.addEventListener('click', function(){ fbPushAll(); });
      }
      break;
    }
    case 'fb-out': fbLogout(); break;
    case 'export': openExport(t); break;
    case 'publish': doPublish(); break;
  }
}

function onKey(e){

/* ================= drag ================= */
var drag = null;
function bindDrag(){
  app.addEventListener('pointerdown', function(e){
    if(e.button!==0 || UI.view!=='schedule') return;
    var chip = e.target.closest('.chip');
    if(chip && !e.target.closest('[data-act]')){ start(e, {mode:'new', subject:chip.dataset.subject}); return; }
    var blk = e.target.closest('.block');
    if(blk){
      var st = cur(), b = byId(st.blocks, blk.dataset.block); if(!b) return;
      if(e.target.closest('[data-grip]')) start(e, {mode:'resize', block:b, el:blk});
      else {
        var rect = blk.getBoundingClientRect(), per = rect.width / Math.max(1,b.span);
        var off = Math.min(b.span-1, Math.max(0, Math.floor((e.clientX-rect.left)/per)));
        start(e, {mode:'move', block:b, el:blk, off:off});
      }
    }
  });
}
function start(e, spec){
  drag = spec; drag.x0=e.clientX; drag.y0=e.clientY; drag.moved=false; drag.ok=false;
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragUp);
  e.preventDefault();
}
function cellAt(x,y){ var el=document.elementFromPoint(x,y); return el?el.closest('.cell'):null; }
function colAt(x){
  var grid=document.getElementById('grid'); if(!grid) return null;
  var cells=grid.querySelectorAll('.cell[data-slot="0"]');
  for(var i=0;i<cells.length;i++){ if(x < cells[i].getBoundingClientRect().right) return i; }
  return cells.length-1;
}
function collides(st, slot, s0, span, skip){
  for(var i=0;i<st.blocks.length;i++){
    var b=st.blocks[i];
    if(b.id===skip || b.slot!==slot) continue;
    if(s0 < b.start+b.span && b.start < s0+span) return true;
  }
  return false;
}
function showGhost(text, cls, x, y, catId){
  var g=document.getElementById('dragghost');
  if(!g){
    Array.prototype.forEach.call(document.querySelectorAll('.dghost'), function(n){ n.remove(); });
    g=document.createElement('div'); g.id='dragghost'; document.body.appendChild(g);
  }
  g.className='dghost'+(cls||''); g.textContent=text;
  if(catId){
    g.style.setProperty('--cb','var(--c-'+catId+'-bg)');
    g.style.setProperty('--ct','var(--c-'+catId+'-tx)');
    g.style.setProperty('--cr','var(--c-'+catId+'-br)');
  }
  g.style.left=x+'px'; g.style.top=(y-24)+'px';
}
function clearPreview(){ var p=document.getElementById('dragprev'); if(p) p.remove(); }
function showPreview(slot,s0,span,bad){
  var grid=document.getElementById('grid'); if(!grid) return;
  var p=document.getElementById('dragprev');
  if(!p){ p=document.createElement('div'); p.id='dragprev'; grid.appendChild(p); }
  p.className='preview'+(bad?' bad':'');
  p.style.setProperty('--gr',(ROWMAP[slot]||4));
  p.style.setProperty('--gc',(s0+2)+'/span '+span);
}
function onDragMove(e){
  if(!drag) return;
  if(!drag.moved){
    if(Math.abs(e.clientX-drag.x0)<4 && Math.abs(e.clientY-drag.y0)<4) return;
    drag.moved=true; if(drag.el) drag.el.classList.add('dragging');
  }
  var st=cur(); if(!st) return;
  var trash=document.getElementById('trash');

  if(drag.mode==='resize'){
    var b=drag.block, c=colAt(e.clientX); if(c==null) return;
    var span=Math.max(1, Math.min(st.monthCount-b.start, c-b.start+1));
    while(span>1 && collides(st,b.slot,b.start,span,b.id)) span--;
    drag.span=span; drag.ok=true;
    showPreview(b.slot,b.start,span,false);
    showGhost(span+'개월','',e.clientX,e.clientY,catOf(subj(b.subject).cat).id);
    return;
  }
  var overTrash = trash && (function(){ var r=trash.getBoundingClientRect();
    return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; })();
  if(trash) trash.classList.toggle('hot', !!(overTrash && drag.mode==='move'));

  var sid = drag.mode==='new' ? drag.subject : drag.block.subject;
  var s = subj(sid), cell = cellAt(e.clientX,e.clientY);

  if(overTrash && drag.mode==='move'){
    clearPreview(); drag.ok=false; drag.trash=true;
    showGhost('삭제',' del',e.clientX,e.clientY); return;
  }
  drag.trash=false;
  if(!cell){
    clearPreview(); drag.ok=false;
    showGhost(s.name,'',e.clientX,e.clientY,catOf(s.cat).id); return;
  }
  var slot=parseInt(cell.dataset.slot,10), m=parseInt(cell.dataset.m,10);
  var span = drag.mode==='new' ? 1 : drag.block.span;
  var s0 = drag.mode==='new' ? m : Math.max(0, m - drag.off);
  if(s0+span > st.monthCount) s0 = Math.max(0, st.monthCount-span);
  var bad = collides(st, slot, s0, span, drag.mode==='move' ? drag.block.id : null);
  showPreview(slot,s0,span,bad);
  drag.target={slot:slot,start:s0,span:span}; drag.ok=!bad;
  showGhost(s.name,'',e.clientX,e.clientY,catOf(s.cat).id);
}
function onDragUp(e){
  setTimeout(fbFlushPending, 300);
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragUp);
  Array.prototype.forEach.call(document.querySelectorAll('.dghost'), function(n){ n.remove(); });
  clearPreview();
  var trash=document.getElementById('trash'); if(trash) trash.classList.remove('hot');
  if(drag && drag.el) drag.el.classList.remove('dragging');
  var d=drag; drag=null; if(!d) return;
  var st=cur();
  if(!d.moved){
    if(d.mode!=='new') openBlockPop(d.block, d.el);
    else toast('과목 칩을 표 안으로 끌어다 놓으세요.');
    return;
  }
  if(!st) return;
  if(d.mode==='resize'){
    if(d.span && d.span!==d.block.span){
      d.block.span=d.span;
      if(d.span>1 && !d.block.numbered){ d.block.numbered=true; d.block.startNo=d.block.startNo||1; }
      mark(); render();
    }
    return;
  }
  if(d.trash && d.mode==='move'){
    st.blocks = st.blocks.filter(function(b){ return b.id!==d.block.id; });
    mark(); render(); return;
  }
  if(!d.ok || !d.target){
    if(d.target) toast('그 자리에는 이미 다른 수업이 있습니다.', true);
    render(); return;
  }
  if(d.mode==='new'){
    st.blocks.push({id:uid('b'), slot:d.target.slot, start:d.target.start, span:1,
      subject:d.subject, startNo:null, numbered:false, note:''});
  } else { d.block.slot=d.target.slot; d.block.start=d.target.start; }
  mark(); render();
}

/* ================= inline cell typing ================= */
function subjectByName(name){
  var n = name.trim().toLowerCase();
  for(var i=0;i<D.subjects.length;i++){
    if(D.subjects[i].name.trim().toLowerCase()===n) return D.subjects[i];
  }
  return null;
}
/* "에펙2" 처럼 뒤에 숫자가 붙으면 과목과 회차로 나눈다 */
function parseTyped(raw){
  var txt = raw.trim();
  if(!txt) return null;
  var hit = subjectByName(txt);
  if(hit) return {subject:hit.id, startNo:null, numbered:false};
  var m = txt.match(/^(.*?)\s*(\d+)$/);
  if(m && m[1].trim() && !m[1].trim().endsWith('-')){
    var base = subjectByName(m[1]);
    if(base) return {subject:base.id, startNo:parseInt(m[2],10), numbered:true};
  }
  var made = {id:uid('s'), name:txt, cat:'etc'};
  D.subjects.push(made);
  return {subject:made.id, startNo:null, numbered:false, isNew:true};
}

var editing = null;
function closeCellEdit(commit){
  var box = document.getElementById('celledit');
  if(!box) return;
  var val = box.querySelector('input').value;
  var at = editing; editing = null; box.remove();
  setTimeout(fbFlushPending, 300);
  if(!commit || !at) return;
  var parsed = parseTyped(val);
  if(!parsed) return;
  var st = cur();
  if(collides(st, at.slot, at.m, 1, null)) return toast('그 자리에는 이미 수업이 있습니다.', true);
  st.blocks.push({id:uid('b'), slot:at.slot, start:at.m, span:1,
    subject:parsed.subject, startNo:parsed.startNo, numbered:parsed.numbered, note:''});
  mark(); render();
  if(parsed.isNew) toast('과목 목록에 추가했습니다. 색은 과목 편집에서 바꿉니다.');
}
function openCellEdit(cell){
  closeCellEdit(false); closePop();
  var st = cur(); if(!st) return;
  var slot = parseInt(cell.dataset.slot,10), m = parseInt(cell.dataset.m,10);
  var grid = document.getElementById('grid'); if(!grid) return;
  editing = {slot:slot, m:m};
  var box = document.createElement('div');
  box.className = 'celledit'; box.id = 'celledit';
  box.style.setProperty('--gr', ROWMAP[slot]||4);
  box.style.setProperty('--gc', (m+2)+'/span 1');
  box.innerHTML = '<input list="subjlist" placeholder="과목명" autocomplete="off" spellcheck="false">';
  grid.appendChild(box);
  var inp = box.querySelector('input');
  inp.focus();
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); closeCellEdit(true); }
    else if(e.key==='Escape'){ e.preventDefault(); closeCellEdit(false); }
    else if(e.key==='Tab'){
      e.preventDefault();
      var nextM = m + (e.shiftKey ? -1 : 1);
      closeCellEdit(true);
      if(nextM>=0 && nextM<cur().monthCount){
        var nx = document.querySelector('.cell[data-slot="'+slot+'"][data-m="'+nextM+'"]');
        if(nx) openCellEdit(nx);
      }
    }
  });
  inp.addEventListener('blur', function(){
    setTimeout(function(){
      if(document.getElementById('celledit') === box) closeCellEdit(true);
    }, 60);
  });
}

/* ================= block popover ================= */
function openBlockPop(b, el){
  closePop();
  var st=cur(), r=el.getBoundingClientRect();
  var p=document.createElement('div'); p.className='pop'; p.id='blockpop';
  p.innerHTML =
    '<div class="pt">수업 설정</div>' +

      '<input type="number" id="bp-no" min="1" max="99" value="'+(b.startNo||1)+'" style="width:66px" '+(b.numbered?'':'disabled')+'></div>' +
    '<div class="prow"><span class="pt" style="flex:1">기간</span>' +
      '<input type="number" id="bp-span" min="1" max="'+(st.monthCount-b.start)+'" value="'+b.span+'" style="width:66px">' +
      '<span class="pt">개월</span></div>' +

function modal(title, bodyHtml, onOk, okLabel){
  var s=document.createElement('div'); s.className='scrim';
  s.innerHTML='<div class="modal"><header>'+esc(title)+'</header><div class="mbody">'+bodyHtml+'</div>' +
    '<footer><button class="btn" data-x="c">취소</button>' +
    '<button class="btn pri" data-x="o">'+esc(okLabel||'저장')+'</button></footer></div>';
  document.body.appendChild(s);
  function close(){ s.remove(); document.removeEventListener('keydown', key); setTimeout(fbFlushPending, 150); }
  function key(ev){ if(ev.key==='Escape') close(); }
  document.addEventListener('keydown', key);
  s.addEventListener('click', function(e){
    if(e.target===s) return close();
    var b=e.target.closest('[data-x]'); if(!b) return;
    if(b.dataset.x==='c') return close();
    if(onOk(s)!==false) close();
  });
  var f=s.querySelector('input,select,textarea'); if(f) f.focus();
  return s;
}

function mentorName(st){

/* 보드 블록 → 관리파일 assignedClasses */
function toAssigned(st){
  var ms = months(st), out = [], n = 0;
  var meta = st.cellMeta || {};
  st.blocks.forEach(function(b){
    for(var k=0;k<b.span;k++){
      var mm = ms[b.start+k]; if(!mm) continue;
      var mk = meta[b.slot + ':' + (b.start + k)] || {};
      out.push({
        id: mk.id || ('a' + Date.now() + (n++)),
        year: String(mm.y),
        month: mm.m + '월',
        time: D.slots[b.slot] || '',
        subject: segLabel(b,k),
        confirmed: !!mk.confirmed,
        room: mk.room || 'A'
      });
    }
  });
  if(Array.isArray(st.orphans)) out = out.concat(st.orphans);
  return out;
}
function orphanCount(st){ return (st && Array.isArray(st.orphans)) ? st.orphans.length : 0; }
function openOrphans(){
  var st = cur(); if(!st || !orphanCount(st)) return;
  var rows = st.orphans.map(function(a){
    return '<tr><td class="d">' + esc((a.year||'') + ' ' + (a.month||'')) + '</td>' +
           '<td class="d">' + esc(a.time||'') + '</td><td>' + esc(a.subject||'') + '</td></tr>';
  }).join('');
  modal('보드가 표에 못 올린 배정',
    '<p class="note-p">관리파일에는 있지만 이 표의 시간대·기간에 맞지 않아 칸을 잡지 못한 배정입니다. ' +
    '한 칸에 두 과목이 들어간 경우도 여기로 옵니다. <b>지워지지 않고 그대로 보관되며</b>, 보드가 저장할 때 관리파일로 다시 돌아갑니다.</p>' +
    '<div style="overflow-x:auto"><table class="tt" style="width:100%"><thead><tr>' +
    '<th>연월</th><th>시간대</th><th>과목</th></tr></thead><tbody>' + rows + '</tbody></table></div>',
    function(){ return true; }, '확인');
}
/* 관리파일 assignedClasses → 보드 학생 한 명 */
function fromAssigned(rec){
  var list = Array.isArray(rec.assignedClasses) ? rec.assignedClasses.slice()
           : (function(){ try{ var a=JSON.parse(rec.assignedClasses||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } })();
  var pts = [], orphans = [], meta = {};
  list.forEach(function(a){
    var y = parseInt(a.year || String(defStart().y), 10);
    var mo = parseInt(String(a.month||'').replace(/[^0-9]/g,''), 10);
    var si = D.slots.indexOf(a.time);
    if(si < 0 || !mo || !y){ orphans.push(a); return; }
    pts.push({y:y, m:mo, slot:si, subject:String(a.subject||'').trim(), src:a});
  });
  var ds = defStart(), sy = ds.y, sm = ds.m, span = 12;
  if(pts.length){
    var keys = pts.map(function(p){ return p.y*12 + (p.m-1); });
    var lo = Math.min.apply(null, keys), hi = Math.max.apply(null, keys);
    sy = Math.floor(lo/12); sm = (lo%12)+1;
    span = Math.max(12, Math.min(36, hi-lo+1));
  }
  var st = {
    id: rec.id || uid('st'),
    mentorId: mentorIdByName(rec.mentor),
    name: String(rec.name||'').trim(),
    status: rec.isCompleted ? '수료' : (rec.isOnLeave ? '휴강' : '수강중'),
    extId: String(rec.appNum||'').trim(),
    phone: String(rec.contact||'').trim(),
    course: String(rec.course||'').trim(),
    enrolledAt: '', note: '',
    startYear: sy, startMonth: sm, monthCount: span, blocks: [], orphans: orphans, cellMeta: meta
  };
  /* 같은 시간대에서 이어지는 같은 과목은 한 블록으로 합친다 */
  var grid = {};
  pts.forEach(function(p){
    var col = (p.y*12 + (p.m-1)) - (sy*12 + (sm-1));
    if(col < 0 || col >= span){ orphans.push(p.src); return; }
    var key = p.slot+':'+col;
    if(grid[key] !== undefined){ orphans.push(p.src); return; }  /* 한 칸에 두 과목이면 두 번째는 보관 */
    grid[key] = p.subject;
    meta[key] = { confirmed: !!(p.src && p.src.confirmed),
                  room: (p.src && p.src.room) || 'A',
                  id: (p.src && p.src.id) || null };
  });
  var seen = {};
  Object.keys(grid).forEach(function(key){
    if(seen[key]) return;
    var parts = key.split(':'), slot = +parts[0], col = +parts[1];
    var label = grid[key], base = label, no = null;
    var m2 = label.match(/^(.*?)\s*(\d+)$/);
    if(m2 && m2[1].trim() && !m2[1].trim().endsWith('-')){ base = m2[1].trim(); no = parseInt(m2[2],10); }
    var len = 1; seen[key] = 1;
    while(true){
      var nk = slot+':'+(col+len), nv = grid[nk];
      if(!nv) break;
      var ok = false;
      if(no!=null){
        var m3 = nv.match(/^(.*?)\s*(\d+)$/);
        ok = !!(m3 && m3[1].trim()===base && parseInt(m3[2],10)===no+len);
      } else ok = (nv===label);
      if(!ok) break;
      seen[nk] = 1; len++;
    }
    var sub = subjectByName(base) || subjectByName(label);
    if(!sub){ sub = {id:uid('s'), name:base, cat:'etc'}; D.subjects.push(sub); }
    st.blocks.push({id:uid('b'), slot:slot, start:col, span:len,
      subject:sub.id, startNo:no, numbered:(no!=null), note:''});
  });
  return st;
}
function mentorIdByName(nm){
  nm = String(nm||'').trim();
  if(!nm) return D.mentors[0].id;
  for(var i=0;i<D.mentors.length;i++) if(D.mentors[i].name===nm) return D.mentors[i].id;
  var made = {id:uid('m'), name:nm};
  D.mentors.push(made);
  return made.id;
}
/* 관리파일 CSV 가져오기에 그대로 넣는 표 */
function csvForMgmt(){
  var rows = [['원서번호','이름','담당멘토','연락처','수강과정','학사일정']];
  D.students.forEach(function(st){
    if(!st.name.trim()) return;
    rows.push([st.extId||'', st.name, mentorName(st), st.phone||'', st.course||'',
      JSON.stringify(toAssigned(st))]);
  });
  return '\ufeff' + rows.map(function(r){ return r.map(qv).join(','); }).join('\n');
}
function importMgmtRecords(arr){
  if(!Array.isArray(arr) || !arr.length) return toast('학생 데이터를 찾지 못했습니다.', true);
  var added = 0, updated = 0;
  arr.forEach(function(rec){
    if(!rec || !rec.name) return;
    var built = fromAssigned(rec);
    var old = null;
    if(built.extId) old = D.students.filter(function(s){ return s.extId && s.extId===built.extId; })[0];
    if(!old) old = D.students.filter(function(s){ return s.name===built.name; })[0];
    if(old){
      built.id = old.id;
      var i = D.students.indexOf(old);
      D.students[i] = built; updated++;
    } else { D.students.push(built); added++; }
  });
  D.students = D.students.filter(function(s){ return s.name.trim() || s.blocks.length; });
  if(!D.students.length) D.students.push(blankStudent());
  UI.studentId = D.students[0].id;
  mark(); render();
  var held = D.students.reduce(function(a,s){ return a + orphanCount(s); }, 0);
  toast('불러왔습니다. 새로 ' + added + '명, 갱신 ' + updated + '명' +
    (held ? ' · 표에 못 올린 배정 ' + held + '건은 보관됨' : ''));
  if(FB.user && FB.db) setTimeout(fbPushAll, 400);
}

    '<div class="frow"><label>방법 1 · 백업 파일</label>' +
      '<input type="file" id="mg-file" accept=".json,application/json"></div>' +

      '<textarea id="mg-text" placeholder=\'[{"name":"홍길동","appNum":"2026-0142", ...}]\' style="min-height:120px"></textarea></div>' +
    '<p class="note-p">관리파일에서 F12 → 콘솔에 <b>copy(localStorage.studentMgmt_v3_students)</b> 를 치면 ' +
    '클립보드에 복사됩니다. 그걸 위 칸에 붙여넣으세요.</p>';
  var root = modal('관리파일에서 가져오기', html, function(r){
    var txt = r.querySelector('#mg-text').value.trim();
    if(!txt){ toast('붙여넣기 칸이 비어 있습니다.', true); return false; }
    try{

  root.querySelector('#mg-file').addEventListener('change', function(){
    var f = this.files && this.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var arr = JSON.parse(rd.result);
        if(!Array.isArray(arr) && arr && Array.isArray(arr.students)) arr = arr.students;
        root.remove();
        importMgmtRecords(arr);
      }catch(e){ toast('JSON 형식이 아닙니다.', true); }
    };
    rd.readAsText(f);
  });
}

function today(){ var d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function qv(v){ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function cellMap(st){
  var map={}; st.blocks.forEach(function(b){
    for(var k=0;k<b.span;k++) map[b.slot+':'+(b.start+k)] = segLabel(b,k); });
  return map;
}
function csvOne(st){
  var ms=months(st), map=cellMap(st);
  var rows=[['시간/수강월'].concat(ms.map(function(m){ return m.y+'-'+String(m.m).padStart(2,'0'); }))];
  D.slots.forEach(function(sl,si){
    rows.push([sl].concat(ms.map(function(_,k){ return map[si+':'+k] || ''; })));
  });
  return '﻿' + rows.map(function(r){ return r.map(qv).join(','); }).join('\n');
}
function csvAll(){
  var rows=[['수강생','멘토','시간대','연월','과목','메모']];
  D.students.forEach(function(st){
    var mt=byId(D.mentors,st.mentorId), ms=months(st);
    st.blocks.forEach(function(b){
      for(var k=0;k<b.span;k++){
        var mm=ms[b.start+k]; if(!mm) continue;
        rows.push([st.name, mt?mt.name:'', D.slots[b.slot], mm.y+'-'+String(mm.m).padStart(2,'0'), segLabel(b,k), b.note||'']);
      }
    });
  });
  return '﻿' + rows.map(function(r){ return r.map(qv).join(','); }).join('\n');
}
function csvRoster(){
  var rows=[['원서번호','이름','담당멘토','상태','연락처','과정명','등록일','시작연월','수강개월','종료연월','수업건수','메모']];
  D.students.forEach(function(st){
    var e=endOf(st), mt=byId(D.mentors,st.mentorId);
    var cnt=st.blocks.reduce(function(a,b){ return a+b.span; },0);
    rows.push([st.extId||'', st.name, mt?mt.name:'', st.status||'', st.phone||'', st.course||'',
      st.enrolledAt||'', st.startYear+'-'+String(st.startMonth).padStart(2,'0'), st.monthCount,
      e.y+'-'+String(e.m).padStart(2,'0'), cnt, st.note||'']);
  });
  return '﻿' + rows.map(function(r){ return r.map(qv).join(','); }).join('\n');
}
function saveFile(filename, text, mime){
  if(downloadsApi){
    downloadsApi.save({filename:filename, data:text, mimeType:mime}).then(function(){ toast('내려받았습니다.'); })
      .catch(function(err){ if(err && err.code==='user_declined') return; linkFallback(filename, text, mime); });
  } else linkFallback(filename, text, mime);
}
function linkFallback(filename, text, mime){
  try{
    var blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('내려받았습니다.');
  }catch(e){ copyFallback(text); }
}
function copyFallback(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      function(){ toast('클립보드에 복사했습니다. 엑셀에 붙여넣으세요.'); },
      function(){ toast('내보내기를 사용할 수 없습니다.', true); });
  } else toast('내보내기를 사용할 수 없습니다.', true);
}
function doImport(){
  var i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.addEventListener('change', function(){
    var f=i.files && i.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var p=JSON.parse(rd.result);
        if(!p.students || !p.subjects) throw 0;
        if(!confirm('현재 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?')) return;
        D=p; UI.studentId = D.students.length? D.students[0].id : null;
        mark(); render(); toast('불러왔습니다. 저장을 눌러야 다른 사람에게도 반영됩니다.');
      }catch(e){ toast('백업 파일 형식이 아닙니다.', true); }
    };
    rd.readAsText(f);
  });
  i.click();
}

/* ================= Firebase 실시간 연동 ================= */
function fbBusy(){
  return !!(document.getElementById('celledit') || drag ||
            document.querySelector('.scrim') || document.getElementById('blockpop'));
}
var fbPending = null, fbPushT = null, fbApplying = false;

function fbInit(){
  if(typeof firebase === 'undefined' || !firebase.initializeApp) return;
  try{
    var cfg = FB_CONFIG;
    try{
      var saved = localStorage.getItem('sched:fbconfig');
      if(saved) cfg = JSON.parse(saved);
    }catch(e){}
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
    FB.auth = firebase.auth();
    FB.db = firebase.firestore();
    FB.available = true;
    FB.auth.onAuthStateChanged(function(u){
      FB.user = u || null;
      if(u) fbSubscribe(); else fbUnsubscribe();
      render();
    });
  }catch(e){ FB.err = e.message || String(e); }
}

function fbSubscribe(){
  if(!FB.db || FB.unsub) return;
  FB.unsub = FB.db.collection('students').onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites) return;
    var recs = snap.docs.map(function(d){
      var o = d.data() || {}; o.id = d.id; return o;
    });
    FB.ready = true;
    if(fbBusy()){ fbPending = recs; return; }
    fbApply(recs);
  }, function(err){
    FB.err = err.message || '읽기 실패';
    toast('실시간 연동 오류: ' + FB.err, true);
  });
}
function fbUnsubscribe(){ if(FB.unsub){ FB.unsub(); FB.unsub = null; } FB.ready = false; }

function fbApply(recs){
  fbApplying = true;
  var keep = UI.studentId;
  var built = recs.filter(function(r){ return r && r.name; }).map(fromAssigned);
  built.sort(function(a,b){
    var x = (a.extId||'zzz'), y = (b.extId||'zzz');
    return x===y ? a.name.localeCompare(b.name,'ko') : (x<y?1:-1);
  });
  D.students = built;
  if(!D.students.length) D.students.push(blankStudent());
  if(!D.students.some(function(s){ return s.id===keep; })) UI.studentId = D.students[0].id;
  fbApplying = false;
  render();
}
function fbFlushPending(){
  if(fbPending && !fbBusy()){ var r = fbPending; fbPending = null; fbApply(r); }
}

function schedulePush(){
  if(!FB.user || !FB.db || fbApplying) return;
  clearTimeout(fbPushT);
  fbPushT = setTimeout(function(){
    var st = cur();
    if(st && st.name.trim()) fbPushStudent(st);
  }, 900);
}
function fbPayload(st){
  return {
    name: st.name.trim(),
    appNum: st.extId || '',
    contact: st.phone || '',
    mentor: mentorName(st),
    course: st.course || '',
    assignedClasses: toAssigned(st),
    _updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    _updatedBy: (FB.user && FB.user.email) || '학사일정 보드'
  };
}
function fbPushStudent(st){
  if(!FB.user || !FB.db || !st || !st.name.trim()) return;
  FB.db.collection('students').doc(st.id).set(fbPayload(st), {merge:true})
    .catch(function(e){ toast('저장 실패: ' + (e.message||''), true); });
}
function fbPushAll(){
  if(!FB.user || !FB.db) return toast('먼저 로그인하세요.', true);
  var n = 0;
  D.students.forEach(function(st){ if(st.name.trim()){ fbPushStudent(st); n++; } });
  toast(n + '명을 관리파일로 올렸습니다.');
}
function fbDeleteStudent(id){
  if(!FB.user || !FB.db) return;
  var ref = FB.db.collection('students').doc(id);
  ref.get().then(function(doc){
    var data = doc.exists ? doc.data() : {};
    data.deletedAt = new Date().toISOString();
    data._updatedBy = (FB.user && FB.user.email) || '학사일정 보드';
    return FB.db.collection('trash').doc(id).set(data);
  }).then(function(){ return ref.delete(); })
    .catch(function(e){ toast('삭제 실패: ' + (e.message||''), true); });
}

function openFbLogin(){
  if(!FB.available){
    return modal('실시간 연동', '<p class="note-p">이 화면에서는 실시간 연동을 쓸 수 없습니다. ' +
      'Firebase는 claude.ai 안에서 외부 접속이 막혀 있어, 내려받은 <b>index.html</b> 을 ' +
      'GitHub Pages 같은 곳에 올려서 여실 때만 동작합니다.</p>', function(){ return true; }, '확인');
  }
  if(FB.user){
    return modal('실시간 연동 중', '<p class="note-p"><b>' + esc(FB.user.email||'') + '</b> 으로 연결되어 있습니다. ' +
      '관리파일에서 학생을 등록하면 여기 목록에 바로 뜨고, 여기서 짠 일정은 관리파일의 배정현황에 바로 반영됩니다.</p>' +
      '<button class="btn sm" id="fb-pushall" style="align-self:flex-start">지금 전체 올리기</button>',
      function(){ return true; }, '닫기');
  }
  var html =
    '<p class="note-p">수강생 관리파일에서 쓰는 계정으로 로그인하면 두 화면이 같은 데이터를 봅니다.</p>' +
    '<div class="frow"><label>이메일</label><input id="fb-email" type="email" autocomplete="username"></div>' +
    '<div class="frow"><label>비밀번호</label><input id="fb-pw" type="password" autocomplete="current-password"></div>' +
    '<p class="note-p" id="fb-msg" style="color:var(--danger)"></p>';
  var root = modal('관리파일과 실시간 연동', html, function(r){
    var em = r.querySelector('#fb-email').value.trim();
    var pw = r.querySelector('#fb-pw').value;
    if(!em || !pw){ r.querySelector('#fb-msg').textContent = '이메일과 비밀번호를 넣어주세요.'; return false; }
    FB.auth.signInWithEmailAndPassword(em, pw).then(function(){
      toast('연결됐습니다.');
      r.remove();
      setTimeout(fbFlushPending, 200);
    }).catch(function(e){
      var m = e.code === 'auth/invalid-credential' ? '이메일이나 비밀번호가 맞지 않습니다.'
            : e.code === 'auth/unauthorized-domain' ? '이 주소가 Firebase 승인 도메인에 없습니다. 콘솔에서 추가하세요.'
            : (e.message || '로그인 실패');
      var box = document.querySelector('#fb-msg');
      if(box) box.textContent = m; else toast(m, true);
    });
    return false;
  }, '로그인');
  return root;
}
function fbLogout(){
  if(FB.auth) FB.auth.signOut().then(function(){ toast('연결을 끊었습니다.'); });
}

/* ================= publish ================= */
function serializeDoc(){
  var clone = document.documentElement.cloneNode(true);
  clone.removeAttribute('data-theme');
  clone.removeAttribute('data-mode');
  var holder = clone.querySelector('#app'); if(holder) holder.innerHTML='';
  ['dragghost','dragprev','blockpop'].forEach(function(id){
    var n=clone.querySelector('#'+id); if(n) n.remove(); });
  Array.prototype.slice.call(clone.querySelectorAll('.scrim,.menu,.pop,.toast,.dghost'))
    .forEach(function(n){ n.remove(); });
  var out = JSON.parse(JSON.stringify(D));
  out.version = (D.version||1) + 1;
  clone.querySelector('#app-data').textContent = JSON.stringify(out).replace(/<\//g,'<\\/');
  return '<!doctype html>\n<html>' + clone.innerHTML + '</html>';
}
function doPublish(){
  if(!artifactApi){
    saveFile('학사일정_백업_'+today()+'.json', JSON.stringify(D,null,1), 'application/json');
    return;
  }
  UI.saving=true; paintSaveState();
  artifactApi.publish(serializeDoc()).then(function(){
    UI.dirty=false; UI.savedOnce=true; UI.saving=false; clearLocal(); paintSaveState();
  }).catch(function(err){
    UI.saving=false; paintSaveState();
    var code = err && err.code;
    if(code==='conflict') toast('다른 사람이 먼저 저장했습니다. 최신본으로 새로고침됩니다.', true);
    else if(code==='not_writer' || code==='not_granted') toast('보기 전용이라 저장할 수 없습니다.', true);
    else toast('저장하지 못했습니다. 잠시 후 다시 시도하세요.', true);
  });
}

fbInit();
setInterval(fbFlushPending, 1500);
var hasRuntime = !!(window.claude && typeof window.claude.use === 'function');
UI.standalone = !hasRuntime;
render();
if(hasRuntime){
  window.claude.use('artifact').then(function(a){
    artifactApi = a;
    if(!a){ UI.standalone = true; render(); }
  }).catch(function(){ UI.standalone = true; render(); });
  window.claude.use('downloads').then(function(d){ downloadsApi=d; }).catch(function(){});
}
})();
</script>
